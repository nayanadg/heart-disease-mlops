name: Heart Disease MLOps CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint source code
        run: flake8 src/ tests/ --max-line-length=100

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Train machine learning model
        run: python src/train.py

      - name: Verify packaged model
        run: python src/predict.py

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-heart-disease-model
          path: |
            models/best_model.joblib
            models/model_metadata.json

      - name: Upload model evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-evaluation-artifacts
          path: artifacts/modeling/
